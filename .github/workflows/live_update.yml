name: Live Conflict Early Warning Update

on:
  schedule:
    # Runs every Monday at 06:00 UTC (matching ACLED weekly release schedule)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-forecasts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Forecast & Alert Pipeline
        env:
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
        run: |
          python src/delivery/live_update.py

      - name: Commit and push updated forecasts to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/phase4_predictions.parquet reports/05_active_alerts.json reports/05_alert_bulletin.md
          if git diff --staged --quiet; then
            echo "No forecast updates to commit."
          else
            git commit -m "Automated: Live weekly forecast and alerts update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi
